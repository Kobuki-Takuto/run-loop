name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy .
      - name: pytest
        run: uv run pytest --cov
