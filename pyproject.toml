[project]
name = "run-loop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "folium>=0.20.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.60.0",
    "streamlit-folium>=0.27.4",
    "streamlit-js-eval>=1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "responses>=0.26.2",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `runloop` / `ui` を editable install の対象にする（T17）。
# `streamlit run ui/app.py` は script 自身のディレクトリ（`ui/`）しか
# sys.path に足さないため、パッケージとしてインストールしていないと
# `import runloop` が失敗する。pytest の `pythonpath = ["."]` は
# pytest 専用の設定で、Streamlit の起動には効かない。
packages = ["runloop", "ui"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "TID", "ANN"]

[tool.ruff.lint.isort]
# 自作パッケージを外部ライブラリと別のブロックに分ける
known-first-party = ["runloop", "ui"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# design.md 1.2 の規律: ui/ 以外は Streamlit を import しない。
# 画面を自動テストしない方針なので、ロジックが Streamlit に依存すると
# 「テストできない範囲」が広がる。
# streamlit_js_eval は runloop/persistence.py が使う（design.md 8.1）ため禁止しない。
"streamlit".msg = "ui/ 以外で Streamlit を import しない（design.md 1.2）"
"streamlit_folium".msg = "ui/ 以外で Streamlit を import しない（design.md 1.2）"

[tool.ruff.lint.per-file-ignores]
# Streamlit 層。ここだけが Streamlit を import してよい
"ui/**" = ["TID251"]
# 使い捨てスクリプト。本体から参照しないため規約を緩める。
# 特に E501 を無効にするのは、docs/design.md 3.3 が spike のコードを行番号つきで
# 引用しているため、整形で行がずれると引用が合わなくなることを避ける意図。
"spike/**" = ["ANN", "E501", "TID251"]

[tool.mypy]
python_version = "3.13"
strict = true
# 使い捨てのスパイクスクリプトは型チェックの対象外（本体から参照しない）
exclude = ['^spike/', '^\.venv/']

[[tool.mypy.overrides]]
# streamlit-js-eval は型情報（py.typed）を同梱していない。
# 個別に緩めるのは、これに触るのが runloop/local_storage.py の1行だけで、
# 呼び出し側は自前の JsEvaluator Protocol で型を付け直しているため（design.md 8.1）。
# strict は全体では外さない。
module = ["streamlit_js_eval.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# streamlit-folium も型情報（py.typed）を同梱していない（T17）。
# folium 自身とは別パッケージで、モジュール全体にスタブが無い点が
# streamlit_js_eval と同じ状況のため、同じ緩め方にする。
module = ["streamlit_folium.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `runloop` / `ui` は T17 から editable install される（[build-system]）。
# この設定はその前の名残りで、テストのみをリポジトリ直下から動かす
# 用途としてまだ意味があるため残す（明示的に消す理由が無い）
pythonpath = ["."]
